<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Listening Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('name')" id="tab-name">Name</button>
        <button class="tab-btn" onclick="switchTab('number')" id="tab-number">Number</button>
        <button class="tab-btn" onclick="switchTab('postcode')" id="tab-postcode">Post Code</button>
        <button class="tab-btn" onclick="switchTab('phone')" id="tab-phone">Phone</button>
        <button class="tab-btn" onclick="switchTab('address')" id="tab-address">Address</button>
        <button class="tab-btn" onclick="switchTab('mix')" id="tab-mix">Mix</button>
    </div>

    <h1 id="mode-title">Name Spelling Test</h1>
    
    <!-- Start Screen -->
    <div id="start-screen">
        <p id="mode-desc">A random full name will be announced and spelled out.<br>Type the correct spelling! (10 Questions)</p>
        <button class="action-btn" onclick="startGame()">Start</button>
    </div>

    <!-- Play Screen -->
    <div id="play-screen" class="hidden">
        <div class="progress" id="progress-text">Question 1 / 10</div>
        
        <div class="audio-control-area">
            <button class="action-btn" style="margin: 0;" onclick="playAudio()">🔊 Listen Again</button>
            <div class="speed-box">
                <label for="speed-range">Speed: <span id="speed-val">1.0</span>x</label>
                <input type="range" id="speed-range" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('speed-val').innerText = this.value">
            </div>
        </div>

        <input type="text" id="answer-input" onkeypress="handleEnter(event)">
        <div class="note" id="mode-note">* Include a space between first and last name</div>
        <br>
        <button class="action-btn" id="submit-btn" onclick="checkAnswer()">Check Answer</button>
        <button class="action-btn hidden" id="next-btn" onclick="nextQuestion()">Next Question</button>
        <div id="feedback-text" class="feedback"></div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
        <h2>Results</h2>
        <p id="score-text" style="font-size: 24px; font-weight: bold;"></p>
        <button class="action-btn" onclick="startGame()">Play Again</button>
    </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
